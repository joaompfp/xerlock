name: pages

# Publishes the standalone build (parsing in the browser; no server) to GitHub Pages at
# https://joaompfp.github.io/xerlock/. Nothing is uploaded from that site: it is static
# files, and .xer files are parsed on the visitor's machine.
on:
  push:
    branches: [client-side-parsing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      # Pages serves the repository at /xerlock/, so every asset path carries that base.
      - run: npm run build:standalone -- --base=/xerlock/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
