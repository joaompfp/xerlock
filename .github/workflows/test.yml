name: tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only check out and test the code. Without this block the
# token inherits the repository default, which may include write access.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # A JRE for MPXJ (backend/mpp.py); the tests that need it are skipped without one.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      # The in-browser build: Python runtime + parser served as static files.
      - run: npm run build:standalone

  # The built app in a real browser: every view, both themes, desktop and phone, each
  # floating panel opened. Catches what unit tests cannot: a menu collapsed to nothing,
  # a panel off-screen, text spilling out, contrast and accessibility faults.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Serve the build
        run: |
          python -m uvicorn backend.main:app --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && exit 0; sleep 1; done; exit 1
      - run: npm run audit:ui -- http://localhost:8000/
        working-directory: frontend
