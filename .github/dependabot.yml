# Weekly upgrade PRs; CI (tests.yml) runs on each before anything is merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      build-tooling:
        patterns: ["vite", "vitest", "@vitejs/*", "esbuild"]
    ignore:
      # TypeScript 7 is the native (Go) compiler and drops the JS API vue-tsc runs on.
      # Lift this once vue-tsc supports it.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
