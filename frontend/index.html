<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XERlock</title>
  <meta name="description" content="Self-hosted Primavera P6 .xer and Microsoft Project schedule viewer — interactive Gantt, critical-path network diagram, DCMA-14-style health checks, progress tracking, and snapshot comparison." />
  <meta property="og:title" content="XERlock" />
  <meta property="og:description" content="Review Primavera P6 and Microsoft Project schedules — no licence required. Interactive Gantt, critical-path network, DCMA-14 health checks, snapshot compare." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="%BASE_URL%og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- One drawing, every platform: SVG for modern browsers (switches with dark mode),
       ICO for legacy Windows tooling and link previews, a 180px PNG for iOS/iPadOS
       home screens and Safari, and a manifest so Edge/Chrome can install it as an app. -->
  <!-- The SVG and iOS icons go through Vite (src/assets/brand), so their built names carry a
       content hash: browsers cache favicons by URL and ignore no-cache, and a stale icon
       would otherwise outlive any redesign. favicon.ico stays at the root because tools
       request /favicon.ico directly. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/src/assets/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#171C23" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
