<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- XERlock mark: a magnifying glass whose lens is a padlock, with the schedule under
       review inside it; the last bar is the critical path. Re-coloured for dark tabs. -->
  <style>
    .ink { stroke: #171C23 } .lens { fill: #fff } .bar { fill: #2456E6 } .crit { fill: #B4291B }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #E6EAF0 } .lens { fill: #171C23 } .bar { fill: #7BA2FF } .crit { fill: #FF8272 }
    }
  </style>
  <path class="ink" d="M9.6 10V6.6a4.4 4.4 0 0 1 8.8 0V10" stroke-width="2.4" stroke-linecap="round"/>
  <circle class="ink lens" cx="14" cy="17" r="8.4" stroke-width="2.6"/>
  <path class="ink" d="M20.2 23.2l7 7" stroke-width="3.2" stroke-linecap="round"/>
  <rect class="bar" x="8.4" y="12.6" width="6.4" height="2.4" rx="1.2"/>
  <rect class="bar" x="11" y="15.8" width="6.4" height="2.4" rx="1.2"/>
  <rect class="crit" x="13.6" y="19" width="5.6" height="2.4" rx="1.2"/>
</svg>
